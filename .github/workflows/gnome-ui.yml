name: GNOME UI

on:
  push:
    paths:
      - 'rog-control-center/gnome/**'
      - 'rog-control-center/rog-control-center'
      - 'rog-control-center/data/**'
      - 'Makefile'
      - '.github/workflows/gnome-ui.yml'
  pull_request:
    paths:
      - 'rog-control-center/gnome/**'
      - 'rog-control-center/rog-control-center'
      - 'rog-control-center/data/**'
      - 'Makefile'
      - '.github/workflows/gnome-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GDK_BACKEND: x11
      GSK_RENDERER: cairo
      GTK_A11Y: none
      PYTHONPATH: rog-control-center/gnome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 xvfb dbus-x11 desktop-file-utils
      - name: Verify protocol and source
        run: make check-rog_gui PYTHON=/usr/bin/python3
      - name: Exercise GTK interface
        run: dbus-run-session -- xvfb-run -a /usr/bin/python3 rog-control-center/gnome/tests/smoke_ui.py
      - name: Exercise shortcut proposal and setup
        run: dbus-run-session -- xvfb-run -a /usr/bin/python3 rog-control-center/gnome/tests/smoke_shortcuts.py
      - name: Verify UI packaging
        run: |
          make install-rog_gui install-data-rog_gui DESTDIR=/tmp/rog-package prefix=/usr
          /usr/bin/python3 /tmp/rog-package/usr/bin/rog-control-center --help
          desktop-file-validate /tmp/rog-package/usr/share/applications/org.opengamingcollective.rog-control-center.desktop
